/* ===== TOKENS (charte HowMuch? v2) ===== */
:root{
  --surface:#F6F0E8;--raised:#FFFFFF;--sunken:#E9E0D3;--ink:#171717;--muted:#5F5850;--line:#DDD3C6;
  --action:#171717;--on-action:#F6F0E8;--focus:#4D7CFE;--sheet:0 -6px 24px rgba(23,23,23,.10);--scrim:rgba(23,23,23,.45);
  --tomato:#F2553D;--butter:#F7D154;--bubble:#FF9AD5;--electric:#4D7CFE;--olive:#8E9A3C;--sky:#9DB8D2;--on-color:#171717;
  --f-d:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--f-n:"Archivo Expanded","Arial Black",sans-serif;--f-t:Outfit,"Helvetica Neue",Arial,sans-serif;
  --r-md:20px;--r-lg:28px;--pill:999px;--g:24px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --surface:#121212;--raised:#1F1F1F;--sunken:#2B2B2B;--ink:#F6F0E8;--muted:#B5ADA3;--line:#383838;
  --action:#F6F0E8;--on-action:#171717;--focus:#8EAAFF;--sheet:0 -6px 24px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}}
:root[data-theme="dark"]{
  --surface:#121212;--raised:#1F1F1F;--sunken:#2B2B2B;--ink:#F6F0E8;--muted:#B5ADA3;--line:#383838;
  --action:#F6F0E8;--on-action:#171717;--focus:#8EAAFF;--sheet:0 -6px 24px rgba(0,0,0,.5);--scrim:rgba(0,0,0,.6);color-scheme:dark}

/* ===== BASE ===== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
img,svg{-webkit-user-drag:none}
textarea,input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
html,body{margin:0;background:var(--surface);color:var(--ink);font:400 17px/24px var(--f-t);-webkit-font-smoothing:antialiased;overscroll-behavior:none;height:100%;overflow:hidden}
body{position:fixed;inset:0;height:100dvh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;transition:transform .15s cubic-bezier(.3,1.4,.5,1),background-color .2s,color .2s}
button:active:not(:disabled){transform:scale(.96)}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
h1,h2,h3,p{margin:0}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{max-width:480px;height:100%;margin:0 auto;position:relative}

/* ===== TYPO ===== */
.eyebrow{font:600 12px/16px var(--f-t);letter-spacing:.08em;text-transform:uppercase}
.muted{color:var(--muted)}
.d-xl{font:800 clamp(42px,12.5vw,52px)/.96 var(--f-d);letter-spacing:-.035em}
.d-lg{font:800 36px/1 var(--f-d);letter-spacing:-.03em}
.ttl{font:700 22px/24px var(--f-d);letter-spacing:-.02em}
.n-xl{font:900 60px/1 var(--f-n);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.n-md{font:900 30px/32px var(--f-n);letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.n-sm{font:900 15px/18px var(--f-n)}
.cap{font:500 14px/18px var(--f-t)}

/* ===== ICÔNES ===== */
.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.25;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:18px;height:18px;stroke-width:2.5}
.star{width:26px;height:26px;fill:var(--sunken);stroke:var(--ink);stroke-width:2;stroke-linejoin:round;flex:none}
.star.on{fill:var(--butter)}
.oc .star{stroke:var(--on-color);fill:transparent}.oc .star.on{fill:var(--on-color)}
.star-s{width:15px;height:15px;stroke-width:2.5}
.stars{display:inline-flex;gap:4px;align-items:center}

/* ===== ILLUSTRATIONS (yeux animés) ===== */
.art svg{display:block;width:100%;height:100%;overflow:visible}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5.2s infinite var(--bd,0s)}
.pupil{transform:translate(var(--px,0px),var(--py,0px));transition:transform .25s ease-out}
@keyframes blink{0%,95%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}

/* ===== BOUTONS ===== */
.btn{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;height:60px;padding:0 24px;border-radius:var(--pill);background:var(--action);color:var(--on-action);font:600 17px/20px var(--f-t);white-space:nowrap}
.btn-badge{justify-content:flex-start;padding-left:10px}
.btn-badge .bdg{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--butter);color:var(--on-color);flex:none}
.btn-badge .arr{margin-left:auto}
.btn-out{background:transparent;color:var(--ink);border:2px solid var(--ink)}
.btn-danger{background:var(--tomato);color:var(--on-color)}
.btn:disabled{background:var(--sunken);color:var(--muted);cursor:default}
.btn+.btn{margin-top:12px}
.ib{display:grid;place-items:center;width:48px;height:48px;border-radius:50%;flex:none;color:var(--ink)}
.ib.solid{background:var(--action);color:var(--on-action)}
.ib.oc{border:2px solid var(--on-color);color:var(--on-color)}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border:2px solid var(--ink);border-radius:var(--pill);font:600 15px/18px var(--f-t);white-space:nowrap;flex:none}
.chip.fill{background:var(--action);color:var(--on-action);border-color:var(--action)}
.chip.coin{background:var(--action);color:var(--on-action);border-color:var(--action);padding-left:4px}
.chip.oc{border-color:var(--on-color);color:var(--on-color)}
.coin-d{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--butter)}
.coin-d svg{width:15px;height:15px;fill:var(--on-color)}
.jk{height:40px;padding:0 14px 0 10px;border-radius:var(--pill);color:var(--on-color);font:600 15px/18px var(--f-t);display:inline-flex;align-items:center;gap:6px}
.jk:disabled{background:transparent!important;color:var(--muted);border:2px dashed var(--line)}

/* ===== COULEURS DE JEU ===== */
.c-tomato{background:var(--tomato)}.c-butter{background:var(--butter)}.c-bubble{background:var(--bubble)}.c-electric{background:var(--electric)}.c-olive{background:var(--olive)}.c-sky{background:var(--sky)}
.oc{color:var(--on-color)}
.rule{border-top:2px solid currentColor;height:0}

/* ===== ANIMATIONS ===== */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes starpop{0%{transform:scale(0) rotate(-90deg)}60%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
@keyframes fall{0%{opacity:0;transform:translateY(-40px) rotate(-4deg)}70%{transform:translateY(4px) rotate(.5deg)}100%{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes drop{40%{transform:scale(1.35) rotate(-18deg)}100%{transform:none}}
.view{animation:rise .35s backwards}
.stg>*{animation:rise .45s backwards;animation-delay:calc(var(--i,0)*45ms)}
.pop{animation:pop .35s both}.shake{animation:sh .45s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

.sheet h2{margin-bottom:12px}
.sheet p.lead{color:var(--muted);margin-bottom:18px}
.sheet .acts{margin-top:20px}
.rules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.rules li{display:grid;grid-template-columns:32px 1fr;gap:12px;align-items:start;font-size:15px;line-height:21px}
.rules li b{width:32px!important;height:32px!important}
.rules li b{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;font:900 14px/1 var(--f-n);color:var(--on-color)}
.dg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dg button{display:flex;flex-direction:column;justify-content:space-between;gap:16px;min-height:104px;padding:16px;border-radius:var(--r-md);text-align:left;color:var(--on-color)}
textarea{width:100%;padding:14px;border-radius:16px;border:2px solid var(--line);background:var(--raised);color:var(--ink);font:13px/1.35 ui-monospace,Menlo,monospace;outline:0;resize:vertical}
textarea:focus{border-color:var(--ink)}
.msg{margin-top:10px;font-weight:600;font-size:15px}

/* Toast */
#toast{position:fixed;left:auto;right:max(24px,calc(50% - 216px));bottom:calc(var(--safe-b) + 100px);width:fit-content;max-width:calc(100% - 48px);box-sizing:border-box;padding:12px 18px;border-radius:var(--pill);background:var(--action);color:var(--on-action);font:600 15px/18px var(--f-t);z-index:30;animation:tIn .35s cubic-bezier(.2,.9,.3,1.2) both;text-align:center}
#toast.out{animation:tOut .25s ease-in both}
@keyframes tIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes tOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(10px) scale(.97)}}
</style>
</head>
<body>
<div id="app">

<!-- ACCUEIL -->
<main id="t-home" class="tab" aria-label="Accueil">
  <div class="top">
    <button class="ib" id="rulesBtn" aria-label="Règles du jeu"></button>
    <span id="logoTop"></span>
    <span class="chip coin" id="starChip" aria-label="Étoiles gagnées"></span>
  </div>
  <div class="hd grow"><span class="eyebrow muted" id="today"></span><h1 class="d-xl" id="hello"></h1></div>
  <button class="play c-tomato oc" id="playCard"></button>
  <div class="tiles">
    <button class="tile c-butter oc" id="dailyCard"></button>
    <button class="tile c-sky oc" id="duelCard"></button>
  </div>
  <div class="strip" id="homeStrip"></div>
</main>

<!-- NIVEAUX -->
<main id="t-levels" class="tab hide" aria-label="Niveaux">
  <div class="hd"><span class="eyebrow muted" id="lvSub"></span><h1 class="d-lg">Niveaux</h1></div>
  <div class="tiers" id="tierBar" role="tablist" aria-label="Paliers"></div>
  <div class="tierHero oc" id="tierHero"></div>
  <div class="lv" id="lvGrid"></div>
</main>

<!-- PRÉCISION -->
<main id="t-stats" class="tab hide" aria-label="Précision">
  <div class="hd"><span class="eyebrow muted">Tes statistiques</span><h1 class="d-lg">Ta précision</h1></div>
  <div id="statBox"></div>
</main>

<!-- RÉGLAGES -->
<main id="t-set" class="tab hide" aria-label="Réglages">
  <div class="hd"><span class="eyebrow muted">Ton jeu, tes règles</span><h1 class="d-lg">Réglages</h1></div>
  <div class="list" id="setList"></div>
</main>

<!-- PARTIE -->
<section id="game" class="scr hide" aria-label="Partie">
  <div class="g-top">
    <div class="g-bar">
      <button class="ib" id="gBack" aria-label="Mettre en pause et revenir à l'accueil"></button>
      <span class="eyebrow sp" id="gLv"></span>
      <button class="jk c-butter" id="jCible"></button>
      <button class="jk c-sky" id="jSwitch"></button>
    </div>
    <div class="segs" id="gSegs" role="progressbar" aria-valuemin="1" aria-valuemax="6"></div>
    <div class="capbox" id="capBox">
      <div class="caprow"><div><span class="eyebrow muted">Capital</span><div class="n-md" id="gCap"></div></div><span class="stars" id="gStars"></span></div>
      <div class="rail" aria-hidden="true"><span class="rl"></span><span class="fl" id="gFill"></span><span class="ms" style="left:33%"></span><span class="ms" style="left:66%"></span><span class="kn" id="gKnob"></span></div>
    </div>
  </div>
  <div class="g-mid" id="gMid"></div>
  <div class="g-bot" id="gBot"></div>
</section>

<!-- DUEL -->
<section id="duel" class="scr hide" aria-label="Duel">
  <div class="g-top">
    <div class="g-bar"><button class="ib" id="dBack" aria-label="Quitter le duel"></button><span class="sp"></span><span class="eyebrow" id="dLv"></span></div>
    <div class="segs" id="dSegs"></div>
    <div class="pl"><div class="c-bubble oc" id="dP0"><span class="eyebrow">Joueur 1</span><div class="n-md" id="dC0"></div></div><div class="c-sky oc" id="dP1"><span class="eyebrow">Joueur 2</span><div class="n-md" id="dC1"></div></div></div>
  </div>
  <div class="g-mid" id="dMid"></div>
  <div class="g-bot" id="dBot"></div>
</section>

<!-- EN LIGNE -->
<section id="online" class="scr hide" aria-label="Partie en ligne">
  <div class="g-top">
    <div class="g-bar"><button class="ib" id="oBack" aria-label="Quitter le salon"></button><span class="eyebrow sp" id="oLbl"></span><span class="chip tmr hide" id="oTmr" role="timer" aria-live="off"></span></div>
    <div class="segs hide" id="oSegs" aria-hidden="true"></div>
    <div class="opl hide" id="oPl"></div>
  </div>
  <div class="g-mid" id="oMid"></div>
  <div class="g-bot" id="oBot"></div>
</section>

<div id="modal" class="hide" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast" class="hide" role="status" aria-live="polite"></div>

<nav id="nav" aria-label="Navigation">
  <button data-t="home" class="on"></button><button data-t="levels"></button><button data-t="stats"></button><button data-t="set"></button>
</nav>
</div>

function catOf(q){const t=q[0];if(q[2])return"dates";
  if(/température|°C/i.test(t))return"quantites";
  if(/superficie|surface|km²|m²|m³|hectares|litres|\((L|cl|ml)\)|volume|débit/i.test(t))return"surfaces";
  if(/vitesse|puissance|tension|énergie|kWh|kilowattheure|\((MW|W|ch|V|gigawatts)\)|km\/h|accélération/i.test(t))return"vitesse";
  if(/poids|\((g|kg|mg|carats)\)|kg de|tonnes|masse|grammes|caféine|once troy|carat/i.test(t))return"poids";
  if(/hauteur|longueur|distance|altitude|profondeur|diamètre|circonférence|largeur|envergure|épaisseur|taille|\((m|km|cm|mm)\)|années-lumière|saut|javelot|marathon|centimètres|millimètres/i.test(t))return"tailles";
  return"quantites"}
/* Unité attendue, lue entre parenthèses dans l'énoncé */
function unitOf(q){if(q[2])return /avant J/.test(q[0])?"av. J.-C.":"année";
  const m=q[0].match(/\(([^)]+)\)/);if(!m)return"";let u=m[1].replace(/^en /,"");
  if(/incluse|inclus|sans|brevet|pièces|mesure|compartiments|Barnard|édition|selon|soudées/i.test(u))return"";
  return /^(m|km|cm|mm|g|mg|kg|tonnes|°C|K|V|W|MW|kWh|ch|ans|jours|heures|minutes|secondes|hectares|litres|L|cl|ml|carats|kcal|dB|Hz|%|gigawatts|miles par heure|×10²³)$|km|m²|m³|°C|lumière|millions|milliards|milliers|masses|m\/s|années/.test(u)?u:""}

   (iOS ne débloque un élément audio que s'il est démarré pendant un geste) et le gain choisit celle qu'on entend. ===== */
const TR={lobby:new Audio("audio/lobby.mp3"),focus:new Audio("audio/focus.mp3")},MVOL={lobby:.35,focus:.3},MG={};

  return"lobby"}
function musInit(){const a=acx();if(!a||MG.ok||MG.fail)return;
  try{for(const k in TR){const g=a.createGain();g.gain.value=0;a.createMediaElementSource(TR[k]).connect(g).connect(a.destination);MG[k]=g;MG["t"+k]=0}MG.ok=1}catch(e){MG.fail=1}}
function musSync(){const w=musWant(),on=!!S.mus&&!document.hidden;if(on)musInit();
  for(const k in TR){const a=TR[k],t=k===w?MVOL[k]:0;
    if(on&&a.paused&&!a._p){a._p=1;a.play().catch(()=>{}).then(()=>{a._p=0})}
    if(MG.ok){if(MG["t"+k]!==t){MG["t"+k]=t;MG[k].gain.setTargetAtTime(t,AC.currentTime,.3)}}
    else{const v=a.volume;a.volume=Math.abs(v-t)>.01?Math.max(0,Math.min(1,v+(t-v)*.2)):t}
    if(!on&&!a.paused&&!a._p&&(MG.ok||a.volume<=.02))a.pause()}}

let AC=null,SG=null,starN=0,starT=0;
function acx(){if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;AC=new C();
    SG=AC.createGain();SG.gain.value=.34;const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=5200;SG.connect(lp).connect(AC.destination)}
  if(AC.state==="suspended")AC.resume();return AC}

const NT=n=>440*Math.pow(2,(n-69)/12);   // note MIDI → Hz
/* Une note : fondamentale + partiel brillant qui s'éteint vite (attaque marimba) */
function tone(f,t,{d=.35,v=.5,type="sine",bright=.25,to=0}={}){const a=AC,o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d*.8);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.006);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g).connect(SG);o.start(t);o.stop(t+d+.05);
  if(bright){const o2=a.createOscillator(),g2=a.createGain();o2.frequency.value=f*4;g2.gain.setValueAtTime(v*bright,t);g2.gain.exponentialRampToValueAtTime(.0005,t+Math.min(.09,d));
    o2.connect(g2).connect(SG);o2.start(t);o2.stop(t+.12)}}
/* Souffle filtré très court : « pop » des boutons */
function puff(t,{f=1800,d=.03,v=.18}={}){const a=AC,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),x=b.getChannelData(0);
  for(let i=0;i<n;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/n,3);
  const s=a.createBufferSource(),bp=a.createBiquadFilter(),g=a.createGain();s.buffer=b;bp.type="bandpass";bp.frequency.value=f;bp.Q.value=1.2;g.gain.value=v;
  s.connect(bp).connect(g).connect(SG);s.start(t)}

  tap:t=>{tone(NT(84),t,{d:.06,v:.22,bright:0,to:NT(79)});puff(t,{f:2400,v:.08})},                  // bouton : petit pop doux
  ok:t=>{tone(NT(79),t,{d:.12,v:.26});tone(NT(86),t+.055,{d:.18,v:.22})},                            // validation : deux notes qui montent
  tick:t=>tone(NT(91),t,{d:.05,v:.12,bright:0}),                                                       // compte à rebours en ligne
  err:t=>{tone(NT(52),t,{d:.12,v:.3,type:"triangle",bright:0});tone(NT(50),t+.09,{d:.16,v:.26,type:"triangle",bright:0})},  // saisie refusée : « bonk » sourd
  near:t=>{tone(NT(79),t,{d:.22,v:.3});tone(NT(84),t+.08,{d:.35,v:.3})},                               // bonne réponse (< 10 pts)
  mid:t=>{tone(NT(76),t,{d:.3,v:.28});tone(NT(74),t+.1,{d:.3,v:.2,bright:.1})},                        // réponse moyenne : neutre
  far:t=>{tone(NT(69),t,{d:.25,v:.26,type:"triangle",bright:0});tone(NT(64),t+.12,{d:.4,v:.24,type:"triangle",bright:0,to:NT(62)})},   // loin : glisse vers le bas
  perfect:t=>{[72,76,79,84].forEach((n,i)=>tone(NT(n+12),t+i*.06,{d:.5,v:.24}));tone(NT(108),t+.26,{d:.6,v:.06,bright:0})},   // « Dans le mille » : arpège + éclat
  joker:t=>{[88,91,96].forEach((n,i)=>tone(NT(n),t+i*.045,{d:.25,v:.13,bright:.1}));puff(t,{f:6000,d:.12,v:.05})},          // joker : scintillement
  star:t=>{const k=performance.now()-starT<900?++starN:(starN=0);starT=performance.now();tone(NT([84,88,91][Math.min(k,2)]),t,{d:.7,v:.2,bright:.4})},  // étoiles : verre, une note de plus par étoile
  win:t=>{[60,64,67,72].forEach((n,i)=>tone(NT(n+12),t+i*.09,{d:.45,v:.22}));[72,76,79].forEach(n=>tone(NT(n+12),t+.4,{d:1.1,v:.11,bright:.1}))},  // niveau gagné : arpège + accord tenu
  lose:t=>{[67,63,60].forEach((n,i)=>tone(NT(n),t+i*.16,{d:.45,v:.22,type:"triangle",bright:0}));tone(NT(55),t+.5,{d:.8,v:.14,type:"triangle",bright:0,to:NT(53)})}  // perdu : descente mineure, feutrée
};

(()=>{const byCat={};for(let i=0;i<N0;i++)(byCat[catOf(Q[i])]=byCat[catOf(Q[i])]||[]).push(i);

/* Import d'une base { level, question, answer } collée telle quelle (sans eval) */
function parseDB(t){const out=[],re=/\{[^{}]*\}/g;let m;
  while((m=re.exec(t))){const o=m[0],
    q=/["']?question["']?\s*:\s*(?:"((?:[^"\\]|\\.)*)"|'((?:[^'\\]|\\.)*)')/.exec(o),a=/["']?answer["']?\s*:\s*(-?\d+(?:\.\d+)?)/.exec(o),
    l=/["']?level["']?\s*:\s*(\d+)/.exec(o);
    if(q&&a)out.push({t:(q[1]!==undefined?q[1]:q[2]).replace(/\\(["'])/g,"$1"),a:+a[1],l:l?+l[1]:0})}
  return out}
const norm=t=>t.toLowerCase().replace(/\s+/g," ").trim();
function importSheet(){hap(H.ok);
  sheet("Mes questions",`<p class="lead">Colle des questions au format { level, question, answer }. Elles s'ajoutent à celles du jeu, rangées selon leur level (1 à 50).</p>
   <textarea id="impT" rows="7" placeholder="{ id: 1, level: 1, question: &quot;…&quot;, answer: 134 }, …" aria-label="Questions à importer"></textarea><div class="msg" id="impM" role="status"></div>`,
   `<button class="btn" id="impGo">Ajouter</button>${CUS.length?`<button class="btn btn-out" id="impNo">Supprimer mes ${CUS.length} questions</button>`:""}<button class="btn btn-out" data-close>Fermer</button>`);
  const msg=(t,e)=>{const m=$("#impM");m.textContent=t;m.style.color=e?"var(--tomato)":"var(--ink)"};
  $("#impGo").onclick=()=>{const o=parseDB($("#impT").value);
    if(!o.length){msg("Aucune question trouvée.",1);hap(H.err);return}
    const have=new Set([...BASE,...CUS].map(x=>norm(x[0]))),nu=[];let dup=0,bad=0;
    o.forEach(x=>{if(!(x.l>=1&&x.l<=50)){bad++;return}const k=norm(x.t);if(have.has(k)){dup++;return}have.add(k);
      nu.push([x.t,x.a,/^(Année|En quelle année|Premier prix Nobel)/i.test(x.t)?1:0,x.l])});
    if(!nu.length){msg(`Rien à ajouter : ${dup} doublon${dup>1?"s":""}, ${bad} sans niveau valide.`,1);return}
    try{localStorage.setItem(QKEY,JSON.stringify(CUS.concat(nu)))}catch(e){msg("Stockage indisponible.",1);return}
    hap(H.good);msg(`${nu.length} question${nu.length>1?"s":""} ajoutée${nu.length>1?"s":""}`+(dup?`, ${dup} doublon${dup>1?"s":""} ignoré${dup>1?"s":""}`:"")+(bad?`, ${bad} sans niveau valide`:"")+".",0);
    const g=$("#impGo");g.textContent="Terminé";g.onclick=()=>location.reload();$$("#sheet [data-close]").forEach(b=>b.onclick=()=>location.reload())};
  if($("#impNo"))$("#impNo").onclick=()=>ask("Supprimer tes questions ?",`Les ${CUS.length} questions ajoutées seront retirées. La base du jeu reste.`,"Supprimer",()=>{try{localStorage.removeItem(QKEY)}catch(e){}S.run=null;S.seen=[];save();location.reload()})}

/* ===== SAISIE : pavé numérique du jeu ===== */
let buf="",padOn=null,isYear=false;   // isYear : pas de séparateur de milliers pour une année   // padOn : fonction appelée à la validation
function padHTML(){return`<div class="pad" role="group" aria-label="Pavé numérique">${[1,2,3,4,5,6,7,8,9].map(d=>`<button data-k="${d}">${d}</button>`).join("")}
  <button class="alt" data-k="," aria-label="Virgule">,</button><button data-k="0">0</button><button class="alt" data-k="del" aria-label="Effacer">${ic("del")}</button></div>`}
function bindPad(root){root.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{hap(H.tap);key(b.dataset.k)})}
function key(k){
  if(k==="del")buf=buf.slice(0,-1);
  else if(k===","){if(!buf.includes(","))buf=(buf.replace("-","")?buf:buf+"0")+","}
  else if(k==="-")buf=buf.startsWith("-")?buf.slice(1):"-"+buf;
  else{if(buf.replace(/\D/g,"").length>=12)return;if(buf==="0")buf=k;else if(buf==="-0")buf="-"+k;else buf+=k}
  renderAns()}
function bufText(){if(!buf||buf==="-")return(buf||"")+"0";const neg=buf.startsWith("-"),b=neg?buf.slice(1):buf,[a,d]=b.split(",");
  return(neg?"−":"")+(isYear?a:a.replace(/\B(?=(\d{3})+(?!\d))/g,NB))+(d!==undefined?","+d:"")}
function renderAns(){const el=document.querySelector(".scr:not(.hide) .ans-v");if(!el)return;const t=bufText(),L=t.length;
  el.className="ans-v"+(buf&&buf!=="-"?"":" ph")+(L>9?" s":L>6?" m":"");el.innerHTML=esc(t)+'<span class="caret"></span>';
  el.setAttribute("aria-label","Ta réponse : "+t)}
const parseBuf=()=>parseFloat(buf.replace(",",".").replace(/,$/,""));
function ansHTML(q,lab="Ta réponse"){const u=unitOf(q);
  return`<div class="ans"><span class="eyebrow muted">${lab}</span><div class="ans-l"><span class="ans-v ph" aria-live="polite">0<span class="caret"></span></span>
   <span class="ans-u">${q[1]<0?`<button class="chip" data-k="-" aria-label="Changer le signe">±</button>`:""}${u?`<span class="chip" title="${esc(u)}">${esc(u)}</span>`:""}</span></div></div>`}
addEventListener("keydown",e=>{if(!padOn||!$("#modal").classList.contains("hide"))return;
  if(/^[0-9]$/.test(e.key))key(e.key);else if(e.key===","||e.key===".")key(",");else if(e.key==="-")key("-");
  else if(e.key==="Backspace")key("del");else if(e.key==="Enter")padOn();else return;e.preventDefault()});

function fit(box){if(!box)return;const els=[...box.querySelectorAll(".qt,.vd,.end .d-xl,.back-t")];els.forEach(e=>{e.style.fontSize="";e.style.lineHeight=""});

  if(o.mode!=="daily"){S.seen=S.seen.concat(o.qs.filter(i=>!S.seen.includes(i)));
    if(LV[o.l].every(i=>S.seen.includes(i)))S.seen=S.seen.filter(i=>!LV[o.l].includes(i))}
  S.run=Object.assign({mode:"lvl",i:0,sw:1,ci:1,hint:"",ph:"q",fb:null},o);save();show()}
const startLevel=l=>startRun({l,cap:capOf(l),start:capOf(l),qs:pickQs(l)});
function startDaily(){const d=today();let s=+d.replace(/-/g,"");const rng=()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
  const qs=[0,1,2,3,4,5].map(k=>{const L=Math.min(50,k*8+1+Math.floor(rng()*8)),p=LV[L].filter(i=>i<N0);return p[Math.floor(rng()*p.length)]});
  startRun({mode:"daily",d,l:0,cap:100,start:100,qs,sw:0,ci:0})}

let shown=null;
function show(){const r=S.run;
  $$(".tab").forEach(e=>e.classList.add("hide"));$("#duel").classList.add("hide");$("#online").classList.add("hide");$("#nav").classList.add("hide");
  const g=$("#game");g.classList.remove("hide");replay(g,"view");shown=null;scrollTo(0,0);
  $("#gLv").textContent=r.mode==="daily"?"Défi du jour":`Niveau ${r.l}`;
  $("#jCible").classList.toggle("hide",r.mode==="daily");$("#jSwitch").classList.toggle("hide",r.mode==="daily");
  setCap(r.ph==="f"&&r.fb?r.cap+r.fb.pen:r.cap,false);
  r.ph==="f"?feedback(false):question()}
function segs(el,i,ph){el.innerHTML=[0,1,2,3,4,5].map(k=>`<span><i style="width:${k<i||(k===i&&ph==="f")?100:k===i?35:0}%"></i></span>`).join("");el.setAttribute("aria-valuenow",i+1)}
$("#gBack").innerHTML=ic("x");$("#gBack").onclick=()=>{hap(H.tap);padOn=null;tab("home");toast("Partie en pause : reprends-la depuis l'accueil")};
$("#jCible").innerHTML=ic("target","i i-sm")+"Cible";$("#jSwitch").innerHTML=ic("swap","i i-sm")+"Switch";
function question(){const r=S.run,q=Q[r.qs[r.i]];buf="";isYear=!!q[2];
  segs($("#gSegs"),r.i,"q");
  $("#jCible").disabled=!r.ci;$("#jSwitch").disabled=!r.sw;
  $("#jCible").setAttribute("aria-label",r.ci?"Joker Cible : obtenir une fourchette":"Joker Cible déjà utilisé");
  $("#jSwitch").setAttribute("aria-label",r.sw?"Joker Switch : changer de question":"Joker Switch déjà utilisé");
  $("#gMid").innerHTML=qcard(q,`Question ${r.i+1} sur 6`,r.hint?`<span class="hint">${ic("target","i i-sm")}${esc(r.hint)}</span>`:"");
  $("#gBot").className="g-bot withpad";
  $("#gBot").innerHTML=ansHTML(q)+padHTML()+`<button class="btn btn-badge" id="gOk"><span class="bdg">${ic("check","i i-sm")}</span>Valider ma réponse<span class="arr">${ic("arrow")}</span></button>`;
  bindPad($("#gBot"));$("#gOk").onclick=()=>{hap(H.ok);submit()};padOn=submit;renderAns();watchEyes($("#gMid"));$("#gMid").scrollTop=0}
/* Capital : décompte, rail et étoiles qui s'éteignent */
function setCap(v,anim=true){const r=S.run,from=shown==null?v:shown;shown=v;
  const ratio=Math.max(0,Math.min(1,v/r.start)),n=starsOf(ratio);
  $("#gFill").style.width=$("#gKnob").style.left=ratio*100+"%";
  $$("#capBox .ms").forEach((m,i)=>m.classList.toggle("hit",ratio>=[.33,.66][i]));
  const prev=$$("#gStars .star.on").length;$("#gStars").innerHTML=[0,1,2].map(i=>star(i<n,"star star-s")).join("");$("#gStars").setAttribute("aria-label",n+" étoiles en jeu");
  if(anim&&n<prev){const s=$$("#gStars .star")[n];if(s){s.style.animation="drop .5s"}}
  const el=$("#gCap"),suf=`<small>/ ${fmt(r.start)} pts</small>`;
  if(anim){const t0=performance.now();(function f(t){const k=Math.min(1,(t-t0)/800),e=1-Math.pow(1-k,3);el.innerHTML=fc(from+(v-from)*e)+suf;if(k<1)requestAnimationFrame(f)})(t0)}
  else el.innerHTML=fc(v)+suf}
function submit(){const r=S.run,q=Q[r.qs[r.i]],v=parseBuf();
  if(!buf||isNaN(v)){replay($(".ans-l"),"shake");hap(H.err);toast("Tape ta réponse sur le pavé");return}
  padOn=null;const pen=penOf(q,v);r.fb={v,gap:Math.abs(q[1]-v),pen};r.cap=r1(r.cap-pen);r.ph="f";record(q,pen);save();feedback(true)}
function verdict(p){return p===0?["Dans le mille.","success","Parfait"]:p<10?["Bien vu !","success",`−${fmt(p)} pts`]:p<35?["Pas mal du tout.","warning",`−${fmt(p)} pts`]:p<70?["Un peu loin.","warning",`−${fmt(p)} pts`]:["Trop loin, cette fois.","danger",`−${fmt(p)} pts`]}
const STC={success:"electric",warning:"butter",danger:"tomato"},STI={success:"check",warning:"bang",danger:"x"};
const statusHTML=(k,t)=>`<span class="status c-${STC[k]}"><span class="si">${ic(STI[k])}</span>${t}</span>`;
function backs(c){const o=["sky","bubble"].map(x=>x===c?"butter":x);return`<div class="bk b1 c-${o[0]}"></div><div class="bk b2 c-${o[1]}"></div>`}
function feedback(anim){const r=S.run,q=Q[r.qs[r.i]],y=!!q[2],f=r.fb,last=r.i===5,dead=r.cap<=0,k=catOf(q),c=CATS[k].c,u=unitOf(q),fact=factOf(q);
  padOn=null;segs($("#gSegs"),r.i,"f");$("#jCible").disabled=$("#jSwitch").disabled=true;
  const[t,st,lab]=verdict(f.pen),gapTxt=y?`${fmt(f.gap,1)} an${f.gap>=2?"s":""}`:q[1]===0?fmt(f.gap):fmt(Math.round(f.gap/Math.abs(q[1])*100))+NB+"%";
  const uu=u&&!y?" "+esc(u):"";
  $("#gMid").innerHTML=`<h2 class="d-lg vd">${t}</h2>${statusHTML(st,lab)}
   <div class="stk">${backs(c)}<div class="flip" id="flip" ${fact?'role="button" tabindex="0" aria-label="Retourner la carte pour lire l\'anecdote"':""}>
    <div class="face c-${c} oc">${art(k)}<span class="eyebrow">Ton écart</span><div class="n-xl${gapTxt.length>7?" long":""}" id="gap">${anim&&!y&&q[1]!==0?"0"+NB+"%":gapTxt}</div>
     <div class="rule"></div><div class="rw"><div><div style="font-weight:600">Réponse : ${fmt(q[1],y)}${uu}</div><div class="cap">Tu as dit ${fmt(f.v,y)} · ${f.pen?"−"+fmt(f.pen)+" pts":"0 pt perdu"}</div></div></div></div>
    ${fact?`<div class="face back c-${c} oc"><span class="eyebrow">Le saviez-vous ?</span><p class="back-t">${esc(fact)}</p><span class="cap">Touche pour revenir</span></div>`:""}
   </div></div>${fact?`<p class="tip cap">${ic("swap","i i-sm")}Touche la carte : le saviez-vous ?</p>`:""}`;
  if(fact){const fl=$("#flip"),tg=()=>{hap(H.tap);fl.classList.toggle("on")};fl.onclick=tg;fl.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();tg()}}}
  if(anim&&!y&&q[1]!==0){const pc=Math.round(f.gap/Math.abs(q[1])*100);setTimeout(()=>countTo($("#gap"),0,pc,500,NB+"%",x=>fmt(Math.round(x))),250)}
  $("#gBot").className="g-bot";$("#gBot").innerHTML=`<button class="btn" id="gNx">${dead?"Voir le résultat":last?"Terminer le niveau":"Question suivante"}${ic("arrow")}</button>`;
  $("#gNx").onclick=()=>{hap(H.tap);next()};watchEyes($("#gMid"));$("#gMid").scrollTop=0;
  if(anim){setCap(r.cap);hap(f.pen===0?H.good:H.loss(f.pen));if(f.pen>=35)replay($("#capBox"),"shake")}}
function next(){const r=S.run;if(r.cap<=0)return end(false);if(r.i===5)return end(true);
  r.i++;r.ph="q";r.fb=null;r.hint="";save();question()}
function end(win){const r=S.run,daily=r.mode==="daily",cap=Math.max(0,r.cap),st=win?Math.max(1,starsOf(cap/r.start)):0;
  if(daily){S.daily={d:r.d,cap,st};S.streak={d:r.d,n:S.streak.d===r.d?S.streak.n:S.streak.d===yest()?S.streak.n+1:1}}
  else if(win){S.stars[r.l]=Math.max(S.stars[r.l]||0,st);if(r.l===S.max&&r.l<50)S.max=r.l+1}
  S.run=null;save();shown=null;padOn=null;hap(win?H.win:H.lose);
  segs($("#gSegs"),6,"f");$("#jCible").classList.add("hide");$("#jSwitch").classList.add("hide");
  const title=daily?(win?"Défi relevé.":"Défi raté."):win?(r.l===50?"Tu as fini le jeu !":`Niveau ${r.l} réussi.`):"Capital épuisé.";
  const sub=daily?(win?`Série : ${S.streak.n} jour${S.streak.n>1?"s":""}. Nouveau défi demain.`:"Reviens demain pour un nouveau défi."):win?"Les étoiles dépendent du capital qu'il te reste.":"Retente : les questions seront différentes.";
  const c=win?(daily?"butter":"tomato"):"sky";
  $("#gMid").innerHTML=`<div class="end"><h2 class="d-xl">${title}</h2><div class="bigstars">${[0,1,2].map(i=>star(i<st)).join("")}</div>
   <div class="endc c-${c} oc">${art(win?(daily?"dates":"vitesse"):"quantites")}<span class="eyebrow">Capital restant</span><div class="n-xl">${fc(cap)}</div><div class="cap" style="max-width:60%">${sub}</div></div></div>`;
  $$("#gMid .bigstars .star.on").forEach((s,i)=>setTimeout(()=>hap(H.star),300+i*180));
  $("#gBot").className="g-bot";$("#gBot").innerHTML=(daily?"":`<button class="btn" id="gAgain">${win&&r.l<50?"Niveau "+S.max:"Rejouer le niveau "+r.l}${ic("arrow")}</button>`)+`<button class="btn btn-out" id="gMenu">Accueil</button>`;
  if($("#gAgain"))$("#gAgain").onclick=()=>{hap(H.ok);startLevel(win&&r.l<50?S.max:r.l)};
  $("#gMenu").onclick=()=>{hap(H.tap);tab("home")};watchEyes($("#gMid"))}
/* Jokers */
$("#jSwitch").onclick=()=>{const r=S.run;if(!r||!r.sw||r.ph!=="q")return;let c=LV[r.l].filter(i=>!r.qs.includes(i));
  if(!c.length)c=(LV[r.l+1]||LV[r.l-1]).filter(i=>!r.qs.includes(i));
  const un=c.filter(i=>!S.seen.includes(i));if(un.length)c=un;if(!c.length)return;
  r.qs[r.i]=c[Math.random()*c.length|0];if(!S.seen.includes(r.qs[r.i]))S.seen.push(r.qs[r.i]);r.sw=0;r.hint="";save();hap(H.joker);question();toast("Nouvelle question")};
$("#jCible").onclick=()=>{const r=S.run,q=Q[r.qs[r.i]];if(!r||!r.ci||r.ph!=="q")return;let lo,hi;
  if(q[2]){lo=q[1]-Math.round(rnd(6,25));hi=q[1]+Math.round(rnd(6,25))}
  else{const a=Math.abs(q[1]);if(a===0){lo=-Math.round(rnd(5,20));hi=Math.round(rnd(5,20))}
    else{const sg=x=>+x.toPrecision(2);let x=sg(a*(1-rnd(.15,.5))),y=sg(a*(1+rnd(.15,.5)));if(x>=a)x=a*.8;if(y<=a)y=a*1.2;lo=q[1]<0?-y:x;hi=q[1]<0?-x:y}}
  r.hint=`Entre ${fmt(lo,!!q[2])} et ${fmt(hi,!!q[2])}`;r.ci=0;save();hap(H.joker);
  $("#jCible").disabled=true;$("#jCible").setAttribute("aria-label","Joker Cible déjà utilisé");
  const qt=$("#qc .qt");qt.insertAdjacentHTML("afterend",`<span class="hint">${ic("target","i i-sm")}${esc(r.hint)}</span>`);fit($("#gMid"))};

let D=null;
$("#dBack").innerHTML=ic("x");$("#dBack").onclick=()=>{hap(H.tap);ask("Quitter le duel ?","Le duel en cours sera perdu.","Quitter",()=>{padOn=null;tab("home")})};
function startDuel(l){D={l,qs:shuffle(duelPool(l)).slice(0,6),i:0,t:0,cap:[100,100],ans:[null,null]};
  $$(".tab").forEach(e=>e.classList.add("hide"));$("#nav").classList.add("hide");$("#game").classList.add("hide");$("#online").classList.add("hide");
  const s=$("#duel");s.classList.remove("hide");replay(s,"view");scrollTo(0,0);
  $("#dLv").textContent=l<10?"Duel · facile":l<30?"Duel · moyen":l<45?"Duel · difficile":"Duel · expert";
  $("#dC0").textContent=$("#dC1").textContent="100";duelQ()}
function duelQ(){D.t=0;D.ans=[null,null];segs($("#dSegs"),D.i,"q");duelTurn()}
function duelTurn(){const q=Q[D.qs[D.i]];buf="";isYear=!!q[2];
  $("#dP0").classList.toggle("act",D.t===0);$("#dP1").classList.toggle("act",D.t===1);
  $("#dMid").innerHTML=qcard(q,`Question ${D.i+1} sur 6`);
  $("#dBot").className="g-bot withpad";
  $("#dBot").innerHTML=ansHTML(q,`À toi, Joueur ${D.t+1}`)+padHTML()+`<button class="btn btn-badge" id="dOk"><span class="bdg">${ic("check","i i-sm")}</span>${D.t?"Valider et révéler":"Valider, au tour du Joueur 2"}<span class="arr">${ic("arrow")}</span></button>`;
  bindPad($("#dBot"));$("#dOk").onclick=duelSubmit;padOn=duelSubmit;renderAns();watchEyes($("#dMid"));$("#dMid").scrollTop=0}
function duelSubmit(){const v=parseBuf();if(!buf||isNaN(v)){replay($("#dBot .ans-l"),"shake");hap(H.err);toast("Tape ta réponse sur le pavé");return}
  D.ans[D.t]=v;hap(H.ok);if(D.t===0){D.t=1;toast("Passe le téléphone au Joueur 2");return duelTurn()}
  padOn=null;const q=Q[D.qs[D.i]],y=!!q[2],pens=D.ans.map(a=>penOf(q,a)),old=D.cap.slice(),u=unitOf(q),c=CATS[catOf(q)].c,fact=factOf(q);
  D.cap=D.cap.map((x,k)=>r1(x-pens[k]));$("#dP0").classList.add("act");$("#dP1").classList.add("act");
  [0,1].forEach(k=>countTo($("#dC"+k),Math.max(0,old[k]),D.cap[k]));hap(H.loss(Math.max(...pens)));segs($("#dSegs"),D.i,"f");
  const best=pens[0]===pens[1]?-1:pens[0]<pens[1]?0:1,last=D.i===5;
  $("#dMid").innerHTML=`<h2 class="d-lg vd">${best<0?"Égalité sur celle-ci.":`Joueur ${best+1} a visé juste.`}</h2>
   <div class="rv c-${c} oc pop"><span class="eyebrow">Bonne réponse</span><div class="n-xl">${fmt(q[1],y)}</div>${u&&!y?`<span class="cap">${esc(u)}</span>`:""}<div class="rule" style="margin:6px 0"></div>
   ${[0,1].map(k=>`<div class="rw"><span><b>Joueur ${k+1}</b> · ${fmt(D.ans[k],y)}</span><b>${pens[k]?"−"+fmt(pens[k])+" pts":"Parfait"}</b></div>`).join("")}</div>
   ${fact?`<div class="fact"><span class="eyebrow">Le saviez-vous ?</span>${esc(fact)}</div>`:""}`;
  $("#dBot").className="g-bot";$("#dBot").innerHTML=`<button class="btn" id="dNx">${last?"Voir le vainqueur":"Question suivante"}${ic("arrow")}</button>`;
  $("#dNx").onclick=()=>{hap(H.tap);if(last)duelEnd();else{D.i++;duelQ()}};eyesEl=null;fit($("#dMid"))}
function duelEnd(){const[a,b]=D.cap,w=a===b?-1:a>b?0:1;hap(H.win);segs($("#dSegs"),6,"f");
  $("#dMid").innerHTML=`<div class="end"><h2 class="d-xl">${w<0?"Égalité !":`Joueur ${w+1} gagne !`}</h2>
   <div class="pl" style="margin-top:24px"><div class="c-bubble oc act" style="opacity:1"><span class="eyebrow">Joueur 1</span><div class="n-md">${fc(a)}</div></div>
   <div class="c-sky oc act" style="opacity:1"><span class="eyebrow">Joueur 2</span><div class="n-md">${fc(b)}</div></div></div></div>`;
  $("#dBot").innerHTML=`<button class="btn" id="dRe">Revanche${ic("arrow")}</button><button class="btn btn-out" id="dMenu">Accueil</button>`;

/* ===== EN LIGNE : jusqu'à 4 joueurs, un salon par code (Firebase Realtime Database, API REST + flux SSE) =====
   rooms/CODE = { m:"cap"|"q", v, state:"lobby"|"q"|"rev"|"end", g (n° de partie), i, qs:[{t,a,y}], fin, ra,
                  players:{pid:{name,s,j,cap,tot,n,last}}, ans:{i:{pid:{v,t}}}, hb:{pid:horodatage} }
   L'arbitre (révélation, question suivante) est le plus ancien joueur encore connecté : la partie continue si l'hôte part. */
const FB="https://howmuch-aeb9e-default-rtdb.europe-west1.firebasedatabase.app";
const SEAT=["bubble","sky","butter","olive"],TLIM=15000,REVW=10000,MAXP=4,SV={".sv":"timestamp"};
const OKEY="howmuch_online_v1";let O0={};try{O0=JSON.parse(localStorage.getItem(OKEY))||{}}catch(e){}
const saveO=()=>{try{localStorage.setItem(OKEY,JSON.stringify(O0))}catch(e){}};
if(!O0.pid){O0.pid=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);saveO()}
const ME=O0.pid;
let O=null;   // session en ligne : {code,R,off,vk,loaded,es,poll,hb,tk,…}
const now=()=>Date.now()+(O?O.off:0);   // heure du serveur (décalage mesuré à l'entrée)
async function fb(p,m="GET",b){const r=await fetch(`${FB}/${p}.json`,{method:m,body:b===undefined?undefined:JSON.stringify(b)});
  if(!r.ok)throw new Error("fb "+r.status);return r.json()}
function setAt(root,path,data){const ks=path.split("/").filter(Boolean);if(!ks.length)return data;
  root=root&&typeof root==="object"?root:{};let o=root;
  for(let i=0;i<ks.length-1;i++){if(!o[ks[i]]||typeof o[ks[i]]!=="object")o[ks[i]]={};o=o[ks[i]]}
  const k=ks[ks.length-1];if(data===null)delete o[k];else o[k]=data;return root}
const oIds=()=>{const P=O.R.players||{};return Object.keys(P).sort((a,b)=>(+P[a].j||0)-(+P[b].j||0)||(a<b?-1:1))};
const oLive=id=>id===ME||now()-(+((O.R.hb||{})[id])||0)<16000;
const hostId=()=>{const ids=oIds();return ids.find(oLive)||ids[0]};
const qOf=i=>{const x=O.R.qs&&O.R.qs[i];return x?[x.t,+x.a,x.y?1:0]:null};
const qLen=()=>{const q=O.R.qs;return q?(Array.isArray(q)?q.length:Object.keys(q).length):0};
const oKey=()=>(O.R.g||0)+"|"+O.R.i;
function oFirst(){const a=(O.R.ans&&O.R.ans[O.R.i])||{},ts=Object.values(a).map(x=>+x.t).filter(t=>t>1e12);return ts.length?Math.min(...ts):null}

/* Feuille d'entrée : prénom, créer ou rejoindre */
function onlineSheet(m){
  sheet("Jouer en ligne",`<p class="lead">Jusqu'à 4 joueurs, chacun sur son téléphone, sur les mêmes questions.</p>
   <label class="eyebrow muted" for="oName">Ton prénom</label><input class="fld" id="oName" maxlength="14" autocomplete="given-name" enterkeyhint="done" value="${esc(O0.name||"")}" placeholder="Ex. Lucas">
   <button class="btn" id="oNew" style="margin-top:12px">Créer un salon</button>
   <div class="or cap">ou rejoins tes amis</div>
   <div class="orow"><input class="fld code" id="oCode" maxlength="4" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" placeholder="CODE" aria-label="Code salon"><button class="btn btn-out" id="oJoin">Rejoindre</button></div>
   <div class="msg" id="oMsg" role="status"></div>`,'<button class="btn btn-out" data-close>Annuler</button>');
  const msg=t=>{const e=$("#oMsg");e.textContent=t;e.style.color="var(--tomato)"};if(m)msg(m);
  const nm=()=>{const v=$("#oName").value.trim().replace(/\s+/g," ").slice(0,14);
    if(!v){msg("Ajoute ton prénom pour que les autres te reconnaissent.");replay($("#oName"),"shake");hap(H.err);return null}
    O0.name=v;saveO();return v};
  const busy=on=>$$("#sheet .btn").forEach(x=>x.disabled=on);
  const err=e=>typeof e==="string"?e:"Connexion impossible au serveur. Vérifie ta connexion.";
  $("#oNew").onclick=async()=>{if(!nm())return;hap(H.ok);const b=$("#oNew");busy(true);b.textContent="Création du salon…";
    try{await oCreate()}catch(e){busy(false);b.textContent="Créer un salon";msg(err(e))}};
  $("#oJoin").onclick=async()=>{if(!nm())return;hap(H.ok);const b=$("#oJoin");busy(true);b.textContent="…";
    try{await oJoin($("#oCode").value)}catch(e){busy(false);b.textContent="Rejoindre";msg(err(e));hap(H.err)}};
  $("#oCode").oninput=e=>{e.target.value=e.target.value.toUpperCase().replace(/[^A-Z]/g,"").slice(0,4)};
  $("#oCode").onkeydown=e=>{if(e.key==="Enter")$("#oJoin").click()}}
async function oCreate(){const A="ABCDEFGHJKLMNPQRSTUVWXYZ";let code="";
  for(let k=0;k<8&&!code;k++){const c=Array.from({length:4},()=>A[Math.random()*A.length|0]).join("");if(await fb(`rooms/${c}/state`)===null)code=c}
  if(!code)throw"Réessaie dans un instant.";
  await fb(`rooms/${code}`,"PUT",{m:"cap",v:300,state:"lobby",i:0,g:0,c:SV,players:{[ME]:{name:O0.name,s:0,j:SV,cap:0,tot:0,n:0}},hb:{[ME]:SV}});
  closeSheet();oEnter(code)}
async function oJoin(code){code=String(code||"").toUpperCase().replace(/[^A-Z]/g,"");
  if(code.length!==4)throw"Le code salon fait 4 lettres.";
  const R=await fb(`rooms/${code}`);if(!R||!R.players)throw"Salon introuvable. Vérifie le code.";
  const P=R.players;
  if(!P[ME]){if(R.state&&R.state!=="lobby")throw"La partie a déjà commencé dans ce salon.";
    if(Object.keys(P).length>=MAXP)throw"Salon complet : 4 joueurs maximum.";
    const used=Object.values(P).map(p=>p.s),s=[0,1,2,3].find(x=>!used.includes(x));
    await fb(`rooms/${code}`,"PATCH",{[`players/${ME}`]:{name:O0.name,s,j:SV,cap:0,tot:0,n:0},[`hb/${ME}`]:SV})}
  else if(P[ME].name!==O0.name)await fb(`rooms/${code}/players/${ME}/name`,"PUT",O0.name);
  closeSheet();oEnter(code)}
function oResume(){if(!O0.name)return onlineSheet();toast("Connexion au salon "+O0.room+"…");
  oJoin(O0.room).catch(e=>{O0.room=null;saveO();renderHome();onlineSheet(typeof e==="string"?e:"Connexion impossible au serveur.")})}

/* Connexion, flux temps réel (repli en interrogation régulière si le flux est indisponible) */
function oEnter(code){if(O)oStop();O={code,R:null,off:0,vk:"",loaded:false};O0.room=code;saveO();
  $$(".tab").forEach(e=>e.classList.add("hide"));$("#nav").classList.add("hide");$("#game").classList.add("hide");$("#duel").classList.add("hide");
  const s=$("#online");s.classList.remove("hide");replay(s,"view");eyesEl=null;
  $("#oLbl").textContent="Salon "+code;["#oPl","#oSegs","#oTmr"].forEach(x=>$(x).classList.add("hide"));
  $("#oMid").innerHTML=`<p class="cap muted" style="margin:auto">Connexion au salon…</p>`;$("#oBot").className="g-bot";$("#oBot").innerHTML="";
  const t0=Date.now();fb(`rooms/${code}/hb/${ME}`,"PUT",SV).then(v=>{if(O&&O.code===code&&typeof v==="number")O.off=v-(t0+Date.now())/2}).catch(()=>{});
  let got=false;const on=()=>{got=true;oOnRoom()};
  try{const es=new EventSource(`${FB}/rooms/${code}.json`);O.es=es;
    const h=e=>{if(!O||O.es!==es)return;let d;try{d=JSON.parse(e.data)}catch(x){return}if(!d||typeof d.path!=="string")return;
      if(e.type==="put")O.R=setAt(O.R,d.path,d.data);
      else Object.keys(d.data||{}).forEach(k=>{O.R=setAt(O.R,d.path.replace(/\/$/,"")+"/"+k,d.data[k])});on()};
    es.addEventListener("put",h);es.addEventListener("patch",h);
    es.addEventListener("cancel",()=>oPoll(on));es.onerror=()=>{if(es.readyState===2)oPoll(on)}}catch(e){oPoll(on)}
  setTimeout(()=>{if(O&&O.code===code&&!got)oPoll(on)},5000);
  setTimeout(()=>{if(O&&O.code===code&&!O.loaded){oStop();O0.room=null;saveO();tab("home");toast("Impossible de joindre le salon")}},15000);
  O.hb=setInterval(()=>{if(O)fb(`rooms/${O.code}/hb/${ME}`,"PUT",SV).catch(()=>{})},5000);
  O.tk=setInterval(oTick,250)}
function oPoll(on){if(!O||O.poll)return;if(O.es){O.es.close();O.es=null}const c=O.code;
  const f=async()=>{try{const R=await fb(`rooms/${c}`);if(O&&O.code===c){O.R=R;on()}}catch(e){}};f();O.poll=setInterval(f,1200)}
function oStop(){if(!O)return;if(O.es)O.es.close();clearInterval(O.poll);clearInterval(O.hb);clearInterval(O.tk);padOn=null;O=null;$("#oTmr").classList.add("hide")}
async function oLeave(){if(!O)return;const c=O.code;oStop();O0.room=null;saveO();tab("home");
  try{await fb(`rooms/${c}`,"PATCH",{[`players/${ME}`]:null,[`hb/${ME}`]:null});if(!(await fb(`rooms/${c}/players`)))await fb(`rooms/${c}`,"DELETE")}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&O&&O.es&&O.es.readyState===2)oPoll(()=>oOnRoom())});
$("#oBack").innerHTML=ic("x");
$("#oBack").onclick=()=>{hap(H.tap);const lob=O&&O.R&&O.R.state==="lobby";
  ask("Quitter le salon ?",lob?"Tu pourras revenir avec le même code tant que la partie n'a pas commencé.":"Tu quittes la partie en cours, les autres continuent sans toi.","Quitter",oLeave)};

function oOnRoom(){if(!O)return;const R=O.R;
  if(!O.loaded){if(R&&R.players)O.loaded=true;else return}
  if(!R||!R.players||!R.players[ME]){oStop();O0.room=null;saveO();tab("home");toast("Tu n'es plus dans ce salon");return}
  oRender()}

/* Affichage : la bande des joueurs est mise à jour en continu, le reste seulement quand la vue change */
function oRender(){const R=O.R,P=R.players,st=R.state||"lobby",ids=oIds(),host=hostId(),me=P[ME],cap=R.m==="cap",g=R.g||0;
  $("#oLbl").textContent=st==="lobby"?"Salon "+O.code:`${O.code} · ${cap?"Survie "+R.v+" pts":"Précision"}`;
  const strip=st==="q"||st==="rev";$("#oPl").classList.toggle("hide",!strip);$("#oSegs").classList.toggle("hide",!strip||cap);
  if(strip){const a=(R.ans&&R.ans[R.i])||{};
    const html=ids.map(id=>{const p=P[id],out=cap&&!(p.cap>0),sc=cap?(out?"Éliminé":fc(p.cap)):(p.n?Math.round(100-p.tot/p.n)+NB+"%":"—");
      return`<div class="c-${SEAT[p.s||0]} oc${id===ME?" me":""}${out?" out":""}${oLive(id)?"":" out"}" aria-label="${esc(p.name)} : ${sc}${st==="q"&&a[id]?", a répondu":""}"><span class="nm">${esc(p.name||"?")}</span><span class="sc">${sc}</span>${st==="q"&&a[id]?`<span class="ok">${ic("check")}</span>`:""}</div>`}).join("");
    if(html!==O.ph){O.ph=html;$("#oPl").innerHTML=html}
    if(!cap){const n=+R.v,el=$("#oSegs");el.style.gap=n>10?"3px":"";
      const sh=Array.from({length:n},(_,k)=>`<span><i style="width:${k<R.i||(k===R.i&&st==="rev")?100:k===R.i?35:0}%"></i></span>`).join("");if(sh!==O.sh){O.sh=sh;el.innerHTML=sh}}}
  let key;
  if(st==="lobby")key=`L${g}|${R.m}|${R.v}|${host}|`+ids.map(id=>id+P[id].name+P[id].s).join(",");
  else if(st==="q"){const x=R.ans&&R.ans[R.i]&&R.ans[R.i][ME],f=oFirst(),exp=!x&&f&&now()>f+TLIM;key=`Q${g}|${R.i}|${x?1:0}|${cap&&!(me.cap>0)?1:0}|${exp?1:0}`}
  else if(st==="rev")key=`R${g}|${R.i}|${host===ME?1:0}`;
  else key=`E${g}|${host===ME?1:0}|`+ids.join();
  if(key===O.vk)return;O.vk=key;
  ({lobby:vLobby,q:vQ,rev:vRev,end:vEnd})[st]()}

/* Salon d'attente */
function vLobby(){const R=O.R,P=R.players,ids=oIds(),hid=hostId(),host=hid===ME,cap=R.m==="cap",vals=cap?[150,300,500]:[5,10,20];padOn=null;
  const seats=ids.map(id=>{const p=P[id],tag=[id===hid?"Hôte":"",id===ME?"Toi":""].filter(Boolean).join(" · ")||"Prêt";
      return`<div class="seat c-${SEAT[p.s||0]} oc"><span class="ttl">${esc(p.name)}</span><span class="cap">${tag}</span></div>`})
    .concat(Array(Math.max(0,MAXP-ids.length)).fill(`<div class="seat open"><span class="cap muted">Place libre</span></div>`)).join("");
  const set=host?`<div class="ruleset"><div class="seg full" role="radiogroup" aria-label="Type de partie">${[["cap","Survie"],["q","Précision"]].map(([k,l])=>`<button role="radio" aria-checked="${R.m===k}" class="${R.m===k?"on":""}" data-m="${k}">${l}</button>`).join("")}</div>
     <div class="seg full" role="radiogroup" aria-label="${cap?"Capital de départ":"Nombre de questions"}">${vals.map(v=>`<button role="radio" aria-checked="${+R.v===v}" class="${+R.v===v?"on":""}" data-v="${v}">${cap?v+" pts":v+" questions"}</button>`).join("")}</div></div>`
    :`<span class="chip fill">${cap?`Survie · ${R.v} pts`:`Précision · ${R.v} questions`}</span>`;
  const desc=cap?`Chacun part avec ${R.v} points, le dernier qui en a encore gagne.`:`${R.v} questions au hasard, le joueur le plus précis gagne.`;
  $("#oMid").innerHTML=`<div class="lob c-electric oc pop">${art("dates")}<span class="eyebrow">Code du salon</span><div class="code" aria-label="Code ${O.code.split("").join(" ")}">${O.code}</div>
     <button class="chip oc" id="oShare">${ic("share","i i-sm")}Partager le code</button></div>
   <div class="sec" style="margin:16px 0 10px"><h2 class="ttl">Joueurs</h2><span class="cap muted">${ids.length} sur ${MAXP}</span></div><div class="seats">${seats}</div>
   <div class="sec" style="margin:16px 0 10px"><h2 class="ttl">La partie</h2>${host?"":'<span class="cap muted">choisie par l\'hôte</span>'}</div>${set}
   <p class="cap muted" style="margin-top:8px">${desc} Dès la première réponse, les autres ont 15 secondes.</p>`;
  $("#oShare").onclick=async()=>{hap(H.tap);const t=`Rejoins ma partie HowMuch? : code salon ${O.code}`;
    try{if(navigator.share){await navigator.share({title:"HowMuch?",text:t});return}}catch(e){if(e&&e.name==="AbortError")return}
    try{await navigator.clipboard.writeText(O.code);toast("Code copié")}catch(e){toast("Code salon : "+O.code)}};
  $$("#oMid [data-m]").forEach(b=>b.onclick=()=>{const m=b.dataset.m;if(m===R.m)return;hap(H.tap);const u={m,v:m==="cap"?300:10};
    Object.assign(O.R,u);oRender();fb(`rooms/${O.code}`,"PATCH",u).catch(()=>toast("Connexion perdue"))});
  $$("#oMid [data-v]").forEach(b=>b.onclick=()=>{const v=+b.dataset.v;if(v===+R.v)return;hap(H.tap);O.R.v=v;oRender();
    fb(`rooms/${O.code}`,"PATCH",{v}).catch(()=>toast("Connexion perdue"))});
  const B=$("#oBot");B.className="g-bot";
  B.innerHTML=host?(ids.length<2?`<button class="btn" disabled>En attente d'un 2ᵉ joueur…</button>`:`<button class="btn btn-badge" id="oGo"><span class="bdg">${ic("arrow","i i-sm")}</span>Lancer la partie<span class="arr">${ic("arrow")}</span></button>`)
    :`<button class="btn" disabled>L'hôte va lancer la partie…</button>`;
  if($("#oGo"))$("#oGo").onclick=oStart;
  eyesEl=$("#oMid .lob .art");fit($("#oMid"))}
function oStart(){const R=O.R,ids=oIds();if(ids.length<2)return;hap(H.ok);
  const n=R.m==="cap"?60:+R.v,pool=shuffle([...Array(N0).keys()]).slice(0,n);
  const u={state:"q",i:0,g:(R.g||0)+1,qs:pool.map(k=>({t:Q[k][0],a:Q[k][1],y:Q[k][2]?1:0})),ans:null,fin:null,ra:null};
  ids.forEach(id=>{u[`players/${id}/cap`]=R.m==="cap"?+R.v:0;u[`players/${id}/tot`]=0;u[`players/${id}/n`]=0;u[`players/${id}/last`]=null});
  $("#oGo").disabled=true;fb(`rooms/${O.code}`,"PATCH",u).catch(()=>{toast("Connexion perdue, réessaie");if($("#oGo"))$("#oGo").disabled=false})}

/* Question */
function vQ(){const R=O.R,me=R.players[ME],q=qOf(R.i),cap=R.m==="cap";if(!q)return;
  const x=R.ans&&R.ans[R.i]&&R.ans[R.i][ME],f=oFirst(),exp=f&&now()>f+TLIM,B=$("#oBot");padOn=null;
  $("#oMid").innerHTML=qcard(q,cap?`Question ${R.i+1}`:`Question ${R.i+1} sur ${R.v}`);
  B.className="g-bot";
  if(cap&&!(me.cap>0))B.innerHTML=`<div class="sent"><span class="eyebrow muted">Éliminé</span><p class="ttl">Tu n'as plus de points.</p><p class="cap muted">Suis la fin de la partie, la revanche arrive.</p></div>`;
  else if(x)B.innerHTML=`<div class="sent"><span class="eyebrow muted">Réponse envoyée</span><div class="n-md">${fmt(+x.v,!!q[2])}${unitOf(q)&&!q[2]?`<small class="cap muted"> ${esc(unitOf(q))}</small>`:""}</div><p class="cap muted">En attente des autres joueurs…</p></div>`;
  else if(exp){B.innerHTML=`<div class="sent"><span class="eyebrow muted">Temps écoulé</span><p class="ttl">Pas de réponse : pénalité maximale.</p></div>`;hap(H.lose)}
  else{buf="";isYear=!!q[2];B.className="g-bot withpad";
    B.innerHTML=ansHTML(q)+padHTML()+`<button class="btn btn-badge" id="oOk"><span class="bdg">${ic("check","i i-sm")}</span>Valider ma réponse<span class="arr">${ic("arrow")}</span></button>`;
    bindPad(B);$("#oOk").onclick=()=>oSubmit();padOn=oSubmit;renderAns()}
  watchEyes($("#oMid"))}
function oSubmit(){const R=O.R,v=parseBuf();
  if(!buf||isNaN(v)){replay($("#oBot .ans-l"),"shake");hap(H.err);toast("Tape ta réponse sur le pavé");return}
  const f=oFirst();if(f&&now()>f+TLIM){toast("Trop tard !");return}
  const i=R.i;padOn=null;hap(H.ok);
  O.R=setAt(O.R,`ans/${i}/${ME}`,{v,t:Math.round(now())});oRender();
  fb(`rooms/${O.code}/ans/${i}/${ME}`,"PUT",{v,t:SV}).catch(()=>toast("Réponse non envoyée, vérifie ta connexion"))}

/* Boucle : chrono, arbitrage (révélation, question suivante), ménage du salon */
function oTick(){if(!O||!O.R||!O.R.players||!O.R.players[ME])return;const R=O.R,st=R.state,host=hostId()===ME,t=now(),tm=$("#oTmr");
  if(st==="q"){const f=oFirst(),a=(R.ans&&R.ans[R.i])||{},act=!(R.m==="cap"&&!(R.players[ME].cap>0)),mine=a[ME];
    if(f){const rem=Math.max(0,Math.ceil((f+TLIM-t)/1000));tm.classList.remove("hide");tm.classList.toggle("hot",rem<=5);
      tm.innerHTML=ic("clock","i i-sm")+rem+NB+"s";tm.setAttribute("aria-label",rem+" secondes restantes");
      if(O.fs!==oKey()){O.fs=oKey();if(!mine&&act){hap(H.joker);toast("Chrono lancé : 15 secondes !")}}
      if(!mine&&act&&rem!==O.ls&&rem<=5&&rem>0)hap(H.tick);O.ls=rem}
    else tm.classList.add("hide");
    if(host&&O.rv!==oKey()){const ids=oIds(),need=ids.filter(id=>R.m!=="cap"||R.players[id].cap>0);
      if((need.length&&need.every(id=>a[id]))||(f&&t>f+TLIM+400))oReveal()}}
  else tm.classList.add("hide");
  if(st==="rev"){const ra=+R.ra,rem=ra>1e12?Math.max(0,Math.ceil((ra+REVW-t)/1000)):null,cd=$("#oCd");
    if(cd&&rem!=null)cd.textContent=host?` · ${rem} s`:`Suite dans ${rem} s…`;
    if(host&&rem===0&&O.adv!==oKey())oNext()}
  if(host&&st==="lobby"&&(!O.pr||t-O.pr>5000)){O.pr=t;const P=R.players,hb=R.hb||{},old=Object.keys(P).filter(id=>id!==ME&&t-(+hb[id]||0)>45000);
    if(old.length){const u={};old.forEach(id=>{u[`players/${id}`]=null;u[`hb/${id}`]=null});fb(`rooms/${O.code}`,"PATCH",u).catch(()=>{})}}
  oRender()}
function oReveal(){const R=O.R,P=R.players,i=R.i,q=qOf(i),cap=R.m==="cap",a=(R.ans&&R.ans[i])||{};O.rv=oKey();if(!q)return;
  const u={state:"rev",ra:SV};let alive=0;
  oIds().forEach(id=>{const p=P[id];if(cap&&!(p.cap>0)){u[`players/${id}/last`]=null;return}
    const x=a[id],pen=x?penOf(q,+x.v):100,nc=r1((+p.cap||0)-pen);
    u[`players/${id}/cap`]=nc;u[`players/${id}/tot`]=r1((+p.tot||0)+pen);u[`players/${id}/n`]=(+p.n||0)+1;
    u[`players/${id}/last`]=x?{v:+x.v,pen}:{pen,no:1};if(nc>0)alive++});
  u.fin=cap?(alive<=1||i+1>=qLen()):i+1>=+R.v;
  fb(`rooms/${O.code}`,"PATCH",u).catch(()=>{O.rv=null})}
function oNext(){const R=O.R;if(O.adv===oKey())return;O.adv=oKey();
  fb(`rooms/${O.code}`,"PATCH",R.fin?{state:"end"}:{state:"q",i:R.i+1}).catch(()=>{O.adv=null})}

/* Révélation */
function vRev(){const R=O.R,P=R.players,i=R.i,q=qOf(i),cap=R.m==="cap";if(!q)return;padOn=null;
  const y=!!q[2],u=unitOf(q),k=catOf(q),c=CATS[k].c,fact=factOf(q),me=P[ME],L=me.last,host=hostId()===ME;
  const ids=oIds().filter(id=>P[id].last).sort((a,b)=>P[a].last.pen-P[b].last.pen);
  let t="La bonne réponse",stt="";
  if(L){const vd=verdict(L.pen);t=L.no?"Trop tard !":vd[0];stt=L.no?statusHTML("danger","−100 pts"):statusHTML(vd[1],vd[2]);
    if(cap&&!(me.cap>0)){t="Éliminé !";stt=statusHTML("danger","Plus de points")}}
  $("#oMid").innerHTML=`<h2 class="d-lg vd">${t}</h2>${stt}
   <div class="rv c-${c} oc pop" style="margin-top:14px"><span class="eyebrow">Bonne réponse</span><div class="n-xl">${fmt(q[1],y)}</div>${u&&!y?`<span class="cap">${esc(u)}</span>`:""}<div class="rule" style="margin:6px 0"></div>
    ${ids.map(id=>{const p=P[id],l=p.last;return`<div class="rw"><span class="who"><i class="c-${SEAT[p.s||0]}"></i><b>${esc(p.name)}</b>&nbsp;· ${l.no?"—":fmt(+l.v,y)}</span><b>${l.pen?"−"+fmt(l.pen)+" pts":"Parfait"}</b></div>`}).join("")}</div>
   ${fact&&ids.length<=2?`<div class="fact"><span class="eyebrow">Le saviez-vous ?</span>${esc(fact)}</div>`:""}`;
  const B=$("#oBot");B.className="g-bot";
  B.innerHTML=host?`<button class="btn" id="oNx">${R.fin?"Voir le classement":"Question suivante"}<span id="oCd"></span>${ic("arrow")}</button>`:`<button class="btn" disabled><span id="oCd">Suite dans 10 s…</span></button>`;
  if($("#oNx"))$("#oNx").onclick=()=>{hap(H.tap);oNext()};
  const rk=oKey();if(L&&O.rec!==rk){O.rec=rk;record(q,L.pen);save();hap(L.no?H.lose:L.pen===0?H.good:H.loss(L.pen))}
  eyesEl=null;fit($("#oMid"))}

/* Classement final */
function vEnd(){const R=O.R,P=R.players,cap=R.m==="cap",host=hostId()===ME;padOn=null;
  const sc=id=>cap?(+P[id].cap||0):-(+P[id].tot||0),ids=oIds().sort((a,b)=>sc(b)-sc(a)),best=sc(ids[0]),top=ids.filter(id=>sc(id)===best),tie=top.length>1;
  const title=tie?"Égalité !":top[0]===ME?"Tu as gagné !":`${esc(P[top[0]].name)} gagne !`;
  const score=id=>{const p=P[id];return cap?fc(Math.max(0,+p.cap||0))+NB+"pts":(p.n?Math.round(100-p.tot/p.n):0)+NB+"%"};
  $("#oMid").innerHTML=`<div class="end"><span class="eyebrow muted">${cap?`Survie · ${R.v} pts au départ`:`Précision · ${R.v} questions`}</span><h2 class="d-xl" style="margin-top:8px">${title}</h2>
   <div class="rk">${ids.map(id=>{const p=P[id],r=1+ids.filter(o=>sc(o)>sc(id)).length;
     return`<div class="${top.includes(id)?"c-butter oc":""}"><b class="n c-${SEAT[p.s||0]}">${r}</b><span class="nm">${esc(p.name)}${id===ME?' <span class="cap">· toi</span>':""}</span><span class="n-sm">${score(id)}</span></div>`}).join("")}</div>
   <p class="cap muted" style="margin-top:12px">${cap?"Classement au capital restant.":"Classement à la précision moyenne."}</p></div>`;
  const B=$("#oBot");B.className="g-bot";
  B.innerHTML=(host?`<button class="btn" id="oRe">Nouvelle partie${ic("arrow")}</button>`:`<button class="btn" disabled>En attente d'une revanche…</button>`)+`<button class="btn btn-out" id="oQuit">Quitter le salon</button>`;
  if($("#oRe"))$("#oRe").onclick=()=>{hap(H.ok);const u={state:"lobby",i:0,qs:null,ans:null,fin:null,ra:null};
    oIds().forEach(id=>{u[`players/${id}/cap`]=0;u[`players/${id}/tot`]=0;u[`players/${id}/n`]=0;u[`players/${id}/last`]=null});
    fb(`rooms/${O.code}`,"PATCH",u).catch(()=>toast("Connexion perdue, réessaie"))};
  $("#oQuit").onclick=()=>{hap(H.tap);oLeave()};
  if(O.ek!==R.g){O.ek=R.g;const w=top.includes(ME);hap(w?H.win:H.lose)}
  eyesEl=null;fit($("#oMid"))}

S.run&&S.run.ph?show():tab("home");
</script>
</body>
